name: Promotion PR

on:
  push:
    branches: [staging]

jobs:
  open-promotion-pr:
    name: Open staging → main PR
    runs-on: ubuntu-latest
    # Serializes concurrent pushes so the second run sees the PR the first created.
    # Prevents the race that required continue-on-error on the create/update step.
    concurrency:
      group: promote-staging
      cancel-in-progress: false
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate commit list
        id: commits
        run: |
          # Use file diff (not commit reachability) for the skip check so that
          # back-merges via squash or cherry-pick — which produce new SHAs with
          # identical content — don't trigger a no-op promotion PR.
          if git diff --quiet origin/main HEAD; then
            echo "Staging is up to date with main — nothing to promote."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            # Commit list is history-based (best effort). In squash/cherry-pick
            # back-merge edge cases it may include commits already on main, but
            # the PR diff will be empty and reviewers will notice.
            git log origin/main..HEAD --pretty=format:"%s (%h)" > /tmp/commits.txt
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update promotion PR
        if: steps.commits.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Use REST API with owner:staging to exclude fork PRs that happen to use a staging branch.
          OWNER="${REPO%/*}"
          EXISTING=$(gh api "repos/$REPO/pulls?base=main&head=${OWNER}:staging&state=open" --jq '.[0].number // empty')

          # Build body using printf to avoid heredoc delimiter injection via commit messages.
          # Note: updating the body overwrites any manual edits made to the PR description.
          # Escape # to \# so GitHub doesn't interpret closing keywords (Fixes #N, Closes #N)
          # in commit subjects and silently close issues when the promotion PR is merged.
          CHANGES=$(sed 's/^/- /; s/#/\\#/g' /tmp/commits.txt)

          # Two-state subgraph warning:
          #
          # State 1 — subgraph code changed but version not yet bumped:
          #   The Release Please PR has not been merged into staging yet. Merging the
          #   promotion PR now would carry subgraph code changes without a version bump
          #   or Goldsky deployment. The Release Please PR must be merged first.
          #
          # State 2 — version bumped (Release Please PR already merged):
          #   Goldsky deployment and staging tag are done. Merging this PR triggers
          #   tag-subgraph-prod.yml which applies the `prod` tag. Confirm indexing first.
          #
          # Subgraph code is any change under packages/subgraph/ excluding CHANGELOG.md,
          # which release-please writes as part of the version bump itself.
          SUBGRAPH_CODE_CHANGED=false
          SUBGRAPH_VERSION_BUMPED=false
          if ! git diff --quiet origin/main HEAD -- packages/subgraph/ ':(exclude)packages/subgraph/CHANGELOG.md'; then
            SUBGRAPH_CODE_CHANGED=true
          fi
          if ! git diff --quiet origin/main HEAD -- packages/subgraph/package.json; then
            SUBGRAPH_VERSION_BUMPED=true
          fi

          {
            printf '%s\n' "## Changes" ""
            printf '%s\n' "$CHANGES" ""
            if $SUBGRAPH_CODE_CHANGED && ! $SUBGRAPH_VERSION_BUMPED; then
              printf '%s\n' ""
              printf '%s\n' "> [!CAUTION]"
              printf '%s\n' "> **This promotion includes subgraph changes without a version bump.** The Release Please PR has not been merged into \`staging\` yet."
              printf '%s\n' "> **Do not merge this PR until the Release Please PR is merged first.** Merging now would carry subgraph code to \`main\` without a Goldsky deployment."
            elif $SUBGRAPH_VERSION_BUMPED; then
              printf '%s\n' ""
              printf '%s\n' "> [!WARNING]"
              printf '%s\n' "> **This promotion includes a subgraph release.** Merging will apply the \`prod\` tag on Goldsky and switch pay.filecoin.cloud to the new subgraph version."
              printf '%s\n' "> Before merging, confirm:"
              printf '%s\n' "> - The release tracking issue confirms indexing is complete on both networks"
              printf '%s\n' "> - The Explorer has been smoke-tested on staging against the new subgraph"
            fi
            printf '%s\n' ""
            printf '%s\n' "---"
            printf '%s\n' "_Auto-generated — merge when staging is validated._"
          } > /tmp/pr-body.md

          if [ -z "$EXISTING" ]; then
            gh pr create \
              --base main \
              --head staging \
              --title "chore: promote staging to production" \
              --body-file /tmp/pr-body.md
          else
            gh pr edit "$EXISTING" --body-file /tmp/pr-body.md
          fi
