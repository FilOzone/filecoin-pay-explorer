schema:
  - "../subgraph/schemas/schema.v1.graphql"
  # Define custom scalars that The Graph uses
  - |
    scalar BigInt
    scalar Bytes
generates:
  ./src/generated/graphql.ts:
    plugins:
      - typescript
    config:
      skipTypename: true
      enumsAsTypes: true
      futureProofEnums: true
      scalars:
        BigInt: string
        Bytes: ../index.js#Bytes
