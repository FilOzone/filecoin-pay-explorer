specVersion: 1.2.0
description: Subgraph Indexer for Filecoin payments contract
repository: https://github.com/FilOzone/filecoin-pay-explorer
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
features:
  - ipfsOnEthereumContracts
dataSources:
  - kind: ethereum
    name: Payments
    network: "{{network}}"
    source:
      abi: Payments
      address: "{{paymentsContractAddress}}"
      startBlock: {{paymentsContractStartBlock}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Rail
        - OperatorApproval
        - Settlement
        - RateChangeQueue
        - RailRatePeriod
        - ProcessedRailRateModification
        - UserToken
        - Token
        - Account
        - AccountOperator
        - Operator
        - Payments
      abis:
        - name: Payments
          file: ./config/Payments-abi.json
        - name: erc20
          file: ./config/erc20-abi.json
      eventHandlers:
        - event: RailCreated(indexed uint256,indexed address,indexed address,address,address,address,address,uint256)
          handler: handleRailCreated
        - event: OperatorApprovalUpdated(indexed address,indexed address,indexed address,bool,uint256,uint256,uint256)
          handler: handleOperatorApprovalUpdated
        - event: RailTerminated(indexed uint256,indexed address,uint256)
          handler: handleRailTerminated
        - event: RailLockupModified(indexed uint256,uint256,uint256,uint256,uint256)
          handler: handleRailLockupModified
        - event: RailRateModified(indexed uint256,uint256,uint256)
          handler: handleRailRateModified
        - event: RailOneTimePaymentProcessed(indexed uint256,uint256,uint256,uint256)
          handler: handleRailOneTimePaymentProcessed
        - event: RailFinalized(indexed uint256)
          handler: handleRailFinalized
        - event: RailSettled(indexed uint256,uint256,uint256,uint256,uint256,uint256)
          handler: handleRailSettled
        - event: DepositRecorded(indexed address,indexed address,indexed address,uint256)
          handler: handleDepositRecorded
        - event: WithdrawRecorded(indexed address,indexed address,indexed address,uint256)
          handler: handleWithdrawRecorded
        - event: AccountLockupSettled(indexed address,indexed address,uint256,uint256,uint256)
          handler: handleAccountLockupSettled
      file: ./src/payments.ts

  - kind: ethereum
    name: FilecoinWarmStorageService
    network: "{{network}}"
    source:
      abi: FilecoinWarmStorageService
      address: "{{fwssContractAddress}}"
      startBlock: {{fwssContractStartBlock}}
    context:
      pdpVerifierAddress:
        type: Bytes
        data: "{{pdpVerifierAddress}}"
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - DataSet
        - Piece
        - Account
        - Rail
      abis:
        - name: FilecoinWarmStorageService
          file: ./config/FilecoinWarmStorageService-abi.json
        - name: PDPVerifier
          file: ./config/PDPVerifier-abi.json
      eventHandlers:
        - event: DataSetCreated(indexed uint256,indexed uint256,uint256,uint256,uint256,address,address,address,string[],string[])
          handler: handleDataSetCreated
        - event: PieceAdded(indexed uint256,indexed uint256,(bytes),string[],string[])
          handler: handlePieceAdded
        # A pre-upgrade PieceAdded that didn't carry pieceCid; handleLegacyPieceAdded
        # backfills it via PDPVerifier.getPieceCid so old datasets aren't undercounted.
        - event: PieceAdded(indexed uint256,indexed uint256,string[],string[])
          handler: handleLegacyPieceAdded
        - event: DataSetServiceProviderChanged(indexed uint256,indexed address,indexed address)
          handler: handleDataSetServiceProviderChanged
        - event: PDPPaymentTerminated(indexed uint256,uint256,uint256)
          handler: handlePDPPaymentTerminated
        - event: CDNPaymentTerminated(indexed uint256,uint256,uint256,uint256)
          handler: handleCDNPaymentTerminated
        - event: ServiceTerminated(indexed address,indexed uint256,uint256,uint256,uint256)
          handler: handleServiceTerminated
      file: ./src/warmStorage.ts

  # Scoped to PiecesRemoved only: proving-health events (PossessionProven,
  # NextProvingPeriod, faults) stay out of this subgraph. Starts at the FWSS
  # start block since no FWSS-tracked dataset's pieces can be removed earlier.
  - kind: ethereum
    name: PDPVerifier
    network: "{{network}}"
    source:
      abi: PDPVerifier
      address: "{{pdpVerifierAddress}}"
      startBlock: {{fwssContractStartBlock}}
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - DataSet
        - Piece
      abis:
        - name: PDPVerifier
          file: ./config/PDPVerifier-abi.json
      eventHandlers:
        - event: PiecesRemoved(indexed uint256,uint256[])
          handler: handlePiecesRemoved
      file: ./src/warmStorage.ts

templates:

  # Token Transfer events from FilecoinPay capture fee-auction purchases (burnForFees)
  # without needing trace_filter. burnForFees emits no event directly; instead it calls
  # ERC-20 transfer to the auction recipient, producing a standard Transfer log we can
  # anchor on. We filter by from == FilecoinPay and the top-level tx's function selector.
  - name: TokenTemplate
    kind: ethereum
    network: "{{network}}"
    source:
      abi: erc20
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Token
        - FeeAuctionPurchase
      abis:
        - name: erc20
          file: ./config/erc20-abi.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleFeeAuctionTransfer
          topic1: ["{{paymentsContractAddress}}"]
      file: ./src/payments.ts
